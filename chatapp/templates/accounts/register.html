{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Create Account — ChatApp{% endblock %}
{% block extra_css %}
<style>
  body { display:flex; align-items:center; justify-content:center; background: radial-gradient(ellipse at 30% 40%, rgba(108,99,255,0.08) 0%, transparent 60%), var(--bg-primary); overflow:auto; }
  .auth-card { width:100%; max-width:440px; background:var(--bg-card); border-radius:20px; padding:2.5rem; border:1px solid var(--border); box-shadow:0 20px 60px rgba(0,0,0,0.5); margin:2rem auto; }
  .brand { font-family:var(--font-mono); color:var(--accent); font-size:1.5rem; font-weight:700; letter-spacing:-1px; }
  .brand span { color:var(--text-primary); }
  label { color:var(--text-secondary); font-size:0.85rem; margin-bottom:4px; }
  .helptext, small { color:var(--text-secondary); font-size:0.78rem; }
</style>
{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="text-center mb-4">
    <div class="brand">chat<span>app</span></div>
    <p class="mt-2" style="color:var(--text-secondary);font-size:0.9rem;">Create your account</p>
  </div>
  {% crispy form %}
  <p class="text-center mt-3" style="color:var(--text-secondary);font-size:0.85rem;">
    Already have an account? <a href="{% url 'accounts:login' %}" style="color:var(--accent);">Sign in</a>
  </p>
</div>
{% endblock %}
