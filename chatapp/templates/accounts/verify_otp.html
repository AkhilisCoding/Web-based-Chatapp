{% extends 'base.html' %}
{% block title %}Verify Email — ChatApp{% endblock %}
{% block extra_css %}
<style>
  body { display:flex; align-items:center; justify-content:center; background: radial-gradient(ellipse at 50% 50%, rgba(108,99,255,0.1) 0%, transparent 60%), var(--bg-primary); }
  .otp-card { width:100%; max-width:400px; background:var(--bg-card); border-radius:20px; padding:2.5rem; border:1px solid var(--border); text-align:center; }
  .otp-input { font-family:var(--font-mono); font-size:2rem; letter-spacing:0.5rem; text-align:center; padding:1rem; border-radius:12px !important; }
  .email-badge { background:var(--bg-hover); border-radius:8px; padding:0.3rem 0.8rem; font-size:0.85rem; color:var(--accent); font-family:var(--font-mono); }
</style>
{% endblock %}
{% block content %}
<div class="otp-card">
  <div style="font-size:2.5rem; margin-bottom:1rem;">📧</div>
  <h5 style="font-weight:600;">Check your email</h5>
  <p style="color:var(--text-secondary);font-size:0.9rem;margin:0.5rem 0 1.5rem;">
    We sent a 6-digit code to<br>
    <span class="email-badge">{{ email }}</span>
  </p>
  <form method="post">
    {% csrf_token %}
    <input type="text" name="otp" class="form-control otp-input" maxlength="6" placeholder="000000" autocomplete="off" autofocus>
    <button type="submit" class="btn btn-primary w-100 mt-3">Verify Code</button>
  </form>
  <p class="mt-3" style="color:var(--text-secondary);font-size:0.82rem;">
    Didn't get it? <a href="{% url 'accounts:resend_otp' %}" style="color:var(--accent);">Resend OTP</a>
  </p>
</div>
{% endblock %}
