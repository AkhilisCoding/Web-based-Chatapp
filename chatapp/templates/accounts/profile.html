{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Profile — ChatApp{% endblock %}
{% block extra_css %}
<style>
  body { display:flex; align-items:center; justify-content:center; overflow:auto; background:var(--bg-primary); }
  .profile-card { width:100%; max-width:480px; background:var(--bg-card); border-radius:20px; padding:2.5rem; border:1px solid var(--border); margin:2rem auto; }
  .avatar-preview { width:80px; height:80px; border-radius:50%; object-fit:cover; border:3px solid var(--accent); }
  label { color:var(--text-secondary); font-size:0.85rem; }
</style>
{% endblock %}
{% block content %}
<div class="profile-card">
  <div class="d-flex align-items-center gap-3 mb-4">
    <img src="{{ request.user.get_avatar_url }}" class="avatar-preview" id="avatarPreview">
    <div>
      <h5 class="mb-0">{{ request.user.username }}</h5>
      <p class="mb-0" style="color:var(--text-secondary);font-size:0.85rem;">{{ request.user.email }}</p>
    </div>
  </div>
  {% crispy form %}
  <div class="mt-3">
    <a href="{% url 'chat:home' %}" class="btn btn-outline-secondary w-100" style="border-radius:10px;">Back to Chats</a>
  </div>
</div>
{% endblock %}
